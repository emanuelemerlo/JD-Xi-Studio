name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Also run by the Release and publish workflows before anything is uploaded
  workflow_call:
    inputs:
      # macOS runs on its own (macos.yml, weekly): its runners can wait in the queue
      # for hours, and a missing runner must not fail a PR or a release
      macos:
        description: "'no' (default): Linux and Windows; 'only': macOS alone; 'yes': all three"
        type: string
        default: "no"

permissions:
  contents: read

concurrency:
  # a called run has its own group: it must not cancel (or be cancelled by) a push run
  group: tests-${{ github.ref }}-${{ github.event_name }}-${{ github.workflow }}-${{ inputs.macos }}
  cancel-in-progress: true

env:
  # Qt without a display; tests create real widgets
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # On a push or a PR inputs.macos is null: Linux and Windows. Linux also runs the
        # oldest and newest supported Pythons.
        include: ${{ fromJSON(inputs.macos == 'only' && '[{"os":"macos-latest","python":"3.11"}]' || (inputs.macos == 'yes' && '[{"os":"ubuntu-latest","python":"3.11"},{"os":"windows-latest","python":"3.11"},{"os":"macos-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.10"},{"os":"ubuntu-latest","python":"3.12"}]' || '[{"os":"ubuntu-latest","python":"3.11"},{"os":"windows-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.10"},{"os":"ubuntu-latest","python":"3.12"}]')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # PortAudio (PyAudio), ALSA (python-rtmidi), libraries Qt loads offscreen
          sudo apt-get install -y portaudio19-dev libasound2-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Default run: excludes tests marked slow (local files, real time) and
      # hardware (a connected JD-Xi); see [tool.pytest.ini_options]
      - name: Test
        run: python -m pytest

  package:
    name: Build and check the packages
    if: inputs.macos != 'only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      # PyPI refuses files over 100 MB (hatch_build.py scales the images down)
      - name: Check sizes
        run: |
          ls -l dist
          for f in dist/*; do
            size=$(stat -c %s "$f")
            if [ "$size" -gt 95000000 ]; then
              echo "::error::$f is $size bytes; PyPI's limit is 100 MB"; exit 1
            fi
          done

      # As a user would: a fresh environment, the wheel and its dependencies
      # from PyPI, run from outside the repository
      - name: Install the wheel and open the editor
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --upgrade pip
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          cp scripts/check_installed.py /tmp/
          cd /tmp && /tmp/wheel-env/bin/python check_installed.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
