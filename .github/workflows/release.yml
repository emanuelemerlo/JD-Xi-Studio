name: Release

# Publishes a release with its files in one go, from the Actions tab:
#   Actions > Release > Run workflow (on main)
# No tag to push by hand: the version comes from jdxi_editor/project.py
# (__version__ = "1.0.0a1" -> tag v1.0.0-alpha.1, a pre-release; "1.0.0" -> v1.0.0).
# It runs the tests, builds the Windows installer and portable app and the
# Python packages, then creates the tag and the release as a draft, attaches
# every file and only then publishes it (a published release cannot be
# changed when immutable releases are on).
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (empty: GitHub writes them from the merged pull requests)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Version and tag
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('jdxi_editor/project.py').read()).group(1))")
          tag="v$(python3 -c "import sys; sys.path.insert(0, '.'); from jdxi_editor.project import release_name; print(release_name('$version'))")"
          case "$tag" in *-*) pre=true;; *) pre=false;; esac
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists: raise __version__ in jdxi_editor/project.py (and the CHANGELOG) first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "### Releasing $tag (version $version, pre-release: $pre)" >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: prepare
    uses: ./.github/workflows/tests.yml

  windows:
    needs: tests
    uses: ./.github/workflows/windows-build.yml

  python:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wheel and source package
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, windows, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the files
        run: |
          set -euo pipefail
          mkdir -p release
          version="${{ needs.prepare.outputs.version }}"
          # the portable app was uploaded as a folder: one zip, as before
          portable=$(find artifacts -maxdepth 1 -type d -name '*-win64-portable' | head -n 1)
          (cd "$portable" && zip -qr "$GITHUB_WORKSPACE/release/JDXI-Editor-$version-win64-portable.zip" .)
          find artifacts -path '*-win64-setup*' -name '*.exe' -exec cp {} release/ \;
          cp artifacts/python-packages/* release/
          ls -l release
          test "$(ls release | wc -l)" -ge 4
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          pre=""; [ "${{ needs.prepare.outputs.prerelease }}" = "true" ] && pre="--prerelease"
          if [ -n "$NOTES" ]; then notes=(--notes "$NOTES"); else notes=(--generate-notes); fi
          # the tag is created here, on the commit that was built and tested
          gh release create "$TAG" --draft $pre "${notes[@]}" --title "JD-Xi Studio $TAG" --target "${{ github.sha }}"
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
          echo "### Published [$TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
