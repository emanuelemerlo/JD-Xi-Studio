name: Release

# Publishes a release with its files in one go, from the Actions tab:
#   Actions > Release > Run workflow (on main)
# No tag to push by hand: the version comes from jdxi_editor/project.py
# (__version__ = "1.0.0a1" -> tag v1.0.0-alpha.1, a pre-release; "1.0.0" -> v1.0.0).
# It runs the tests, builds the Windows installer and portable app, the macOS
# disk image, the Linux .deb and the Python packages, then creates the tag and the release as a draft, attaches
# every file and only then publishes it (a published release cannot be
# changed when immutable releases are on).
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes text: leave EMPTY to use the version's section of CHANGELOG.md (the version itself comes from project.py)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Version and tag
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('jdxi_editor/project.py').read()).group(1))")
          tag="v$(python3 -c "import sys; sys.path.insert(0, '.'); from jdxi_editor.project import release_name; print(release_name('$version'))")"
          case "$tag" in *-*) pre=true;; *) pre=false;; esac
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists: raise __version__ in jdxi_editor/project.py (and the CHANGELOG) first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "### Releasing $tag (version $version, pre-release: $pre)" >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: prepare
    uses: ./.github/workflows/tests.yml
    with:
      # Linux and Windows (the default): the app shipped here is the Windows one and
      # the Python package. macOS is tested every week on its own (macos.yml).
      macos: "no"

  windows:
    needs: tests
    uses: ./.github/workflows/windows-build.yml

  # macOS disk image and Linux .deb. When no macOS runner comes within the hour
  # the job fails and nothing is published (the tag does not exist yet):
  # «Re-run failed jobs» later builds it and publishes the release.
  desktop:
    needs: tests
    uses: ./.github/workflows/desktop-build.yml

  python:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Wheel and source package
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, windows, desktop, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Collect the files
        run: |
          set -euo pipefail
          mkdir -p release
          version="${{ needs.prepare.outputs.version }}"
          # the portable app was uploaded as a folder: one zip, as before
          portable=$(find artifacts -maxdepth 1 -type d -name '*-win64-portable' | head -n 1)
          (cd "$portable" && zip -qr "$GITHUB_WORKSPACE/release/JD-Xi-Studio-$version-win64-portable.zip" .)
          find artifacts -path '*-win64-setup*' -name '*.exe' -exec cp {} release/ \;
          cp artifacts/python-packages/* release/
          cp artifacts/linux-deb/*.deb artifacts/macos-dmg/*.dmg release/
          ls -l release
          # portable zip, installer, wheel, sdist, .deb, .dmg
          test "$(ls release | wc -l)" -ge 6
      # RELEASE_TOKEN (Settings › Secrets and variables › Actions), when set: a fine-grained
      # token for this repository with Contents and Workflows read and write (a tag on a
      # commit that changes .github/workflows needs Workflows). GitHub refused the Actions
      # token here for 1.0.0b1 (HTTP 403 "Resource not accessible by integration" on
      # POST /releases, with contents: write granted); without the secret the Actions
      # token is used as before.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TOKEN_KIND: ${{ secrets.RELEASE_TOKEN != '' && 'RELEASE_TOKEN' || 'the Actions token' }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          pre=""; [ "${{ needs.prepare.outputs.prerelease }}" = "true" ] && pre="--prerelease"
          if [ -n "$NOTES" ]; then
            notes=(--notes "$NOTES")
          else
            # the version's section of the CHANGELOG (from its "# [version]" heading to the next one)
            python3 - "${{ needs.prepare.outputs.version }}" > notes.md <<'PY'
          import sys
          version, out, inside = sys.argv[1], [], False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if line.startswith("# ["):
                  if inside:
                      break
                  inside = line.startswith(f"# [{version}]")
                  continue
              if inside:
                  out.append(line)
          print("".join(out).strip() or "See CHANGELOG.md.")
          PY
            notes=(--notes-file notes.md)
          fi
          # the tag is created here, on the commit that was built and tested
          echo "Creating the release with $TOKEN_KIND"
          if ! gh release create "$TAG" --draft $pre "${notes[@]}" --title "JD-Xi Studio $TAG" --target "${{ github.sha }}"; then
            echo "::error title=Release not created::GitHub refused $TOKEN_KIND. Create a fine-grained token (Settings › Developer settings › Fine-grained tokens) for this repository only, with Contents and Workflows: Read and write, save it as the secret RELEASE_TOKEN (repository Settings › Secrets and variables › Actions) and use Re-run failed jobs."
            exit 1
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
          echo "### Published [$TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
