name: Desktop packages

# The macOS disk image and the Linux .deb (the Windows installer is
# windows-build.yml). Each is built on its own platform with PyInstaller
# (building/desktop/jdxi_studio.spec), started to check it runs, packaged
# (building/desktop/package.py) and uploaded as an artifact.
#
# The Release workflow calls it and attaches the files; Actions › Desktop
# packages › Run workflow builds them on any branch, to try them (build/**
# branches build them on every push).
#
# - Linux: built on Ubuntu 22.04, so the .deb runs on that and later
#   (Debian 12, Ubuntu 24.04, Mint 21+…): a build on a newer system would need
#   its newer C library. The .deb is installed on the runner and started.
# - macOS: two disk images, built on Apple silicon (arm64, macos-latest) and
#   on Intel (x86_64, macos-15-intel: it also runs on Apple silicon through
#   Rosetta). Signed ad hoc only (Developer ID signing and notarisation come
#   later). macOS runners are often scarce (GitHub gives up on a job that no
#   runner takes in ~15 minutes): each image is built on its own, and a
#   release needs at least one of them.
on:
  workflow_dispatch:
  workflow_call:
  # a branch that changes the packaging builds them by itself
  push:
    branches: ["build/**"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux .deb
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # portaudio and ALSA headers to build PyAudio and python-rtmidi; the libraries
      # the .deb depends on, to start the app here
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pillow

      - name: PyInstaller
        run: |
          # from outside the checkout: the spec imports the installed package
          cd "$RUNNER_TEMP"
          pyinstaller --noconfirm --clean --distpath "$GITHUB_WORKSPACE/dist" \
            --workpath "$RUNNER_TEMP/pyi-build" "$GITHUB_WORKSPACE/building/desktop/jdxi_studio.spec"

      - name: Package
        run: python -m building.desktop.package deb

      # Installed as a user would, then started: still running after 30 s, or the
      # build is broken (an import or a library missing makes it exit at once)
      - name: Install the .deb and start it
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/jd-xi-studio_*_amd64.deb
          test -x /usr/bin/jd-xi-studio
          test -f /usr/share/applications/jd-xi-studio.desktop
          set +e
          QT_QPA_PLATFORM=offscreen timeout 30 jd-xi-studio > smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error title=Linux smoke test::jd-xi-studio exited with code $code"
            tail -n 60 smoke.log
            exit 1
          fi
          echo "jd-xi-studio started and kept running"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: dist/jd-xi-studio_*_amd64.deb
          compression-level: 0
          if-no-files-found: error

  macos:
    name: macOS disk image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: PortAudio (for PyAudio)
        run: brew install portaudio

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: PyInstaller
        run: |
          cd "$RUNNER_TEMP"
          pyinstaller --noconfirm --clean --distpath "$GITHUB_WORKSPACE/dist" \
            --workpath "$RUNNER_TEMP/pyi-build" "$GITHUB_WORKSPACE/building/desktop/jdxi_studio.spec"

      - name: Start the app
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen "dist/JD-Xi Studio.app/Contents/MacOS/JD-Xi-Studio" > smoke.log 2>&1 &
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "JD-Xi Studio started and kept running"
          else
            wait "$pid"; code=$?
            echo "::error title=macOS smoke test::JD-Xi Studio exited with code $code"
            tail -n 60 smoke.log
            exit 1
          fi

      - name: Disk image
        run: |
          python -m building.desktop.package dmg
          hdiutil verify dist/*.dmg

      - uses: actions/upload-artifact@v6
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          compression-level: 0
          if-no-files-found: error
