name: Windows build

# Builds the Windows app (PyInstaller, one folder) and its installer (Inno Setup),
# opens it for a smoke test, and uploads both as artifacts. On a v* tag the
# files are also attached to a GitHub release (a pre-release for v*-beta.N tags).
# The Release workflow (release.yml) calls it too, and publishes the files itself.
on:
  push:
    branches: ["fix/**", "feature/**", "release/**"]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path jdxi_editor/project.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $sha = "${{ github.sha }}".Substring(0, 7)
          "version=$v" >> $env:GITHUB_OUTPUT
          "label=$v-$sha" >> $env:GITHUB_OUTPUT
          # A release tag must match the app's version: v0.10.0-beta.1 <-> 0.10.0b1
          if ("${{ github.ref_type }}" -eq "tag") {
            $t = "${{ github.ref_name }}" -replace '^v', '' -replace '-alpha\.?', 'a' -replace '-beta\.?', 'b' -replace '-rc\.?', 'rc'
            if ($t -ne $v) {
              "::error::Tag ${{ github.ref_name }} does not match __version__ $v in jdxi_editor/project.py"
              exit 1
            }
          }

      # Not editable: the wheel build puts the scaled-down resources inside the
      # package (jdxi_editor/_bundle/resources), which the spec bundles
      - name: Install
        id: install
        shell: bash
        run: |
          set -o pipefail; mkdir -p logs
          { python -m pip install --upgrade pip &&
            python -m pip install ".[soundfont]" pyinstaller pytest; } 2>&1 | tee logs/install.log

      - name: Test
        id: test
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_preset_tables_match_manual.py tests/test_program_common_addresses.py tests/test_i18n.py tests/test_update_checker.py tests/test_v2_analog.py tests/test_v2_effects.py tests/test_v2_program.py tests/test_v2_digital.py tests/test_v2_drums.py tests/test_v2_vocal.py tests/test_v2_arpeggio.py tests/test_recipes.py tests/test_v2_players.py tests/test_window_link.py tests/test_v2_programs.py tests/test_v2_settings.py tests/test_v2_main.py tests/test_branding.py tests/test_ui_audit.py tests/test_fit_text.py -q 2>&1 | tee logs/test.log

      - name: PyInstaller
        id: pyinstaller
        shell: bash
        run: |
          set -o pipefail
          # Run from outside the checkout so the spec imports the installed
          # package (with _bundle/resources), not the source tree
          cd "$RUNNER_TEMP"
          pyinstaller --noconfirm --clean \
            --distpath "$GITHUB_WORKSPACE/dist" --workpath "$RUNNER_TEMP/pyi-build" \
            "$GITHUB_WORKSPACE/building/windows/jdxi_editor.spec" 2>&1 | tee "$GITHUB_WORKSPACE/logs/pyinstaller.log"

      # The app must still be running after 30 s: an import error or a missing
      # resource makes a windowed PyInstaller app exit straight away
      - name: Smoke test
        id: smoke
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/JD-Xi-Studio/JD-Xi-Studio.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            "JD-Xi-Studio.exe exited with code $($p.ExitCode)" | Out-File logs/smoke.log
            Get-ChildItem -Recurse $env:USERPROFILE -Filter *.log -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'jdxi' } |
              ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 60 } |
              Out-File -Append logs/smoke.log
            # Run the console Python entry point for the traceback
            & dist/JD-Xi-Studio/JD-Xi-Studio.exe 2>&1 | Select-Object -First 60 | Out-File -Append logs/smoke.log
            Get-Content logs/smoke.log
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "JD-Xi-Studio.exe started and kept running"

      - name: Portable zip
        id: zip
        shell: pwsh
        run: |
          $name = "JD-Xi-Studio-${{ steps.version.outputs.label }}-win64-portable.zip"
          Compress-Archive -Path dist/JD-Xi-Studio -DestinationPath "dist/$name"
          "PORTABLE=dist/$name" >> $env:GITHUB_ENV

      - name: Installer
        id: installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DMyAppVersion=${{ steps.version.outputs.version }} jdxi_editor.iss *>&1 | Tee-Object -FilePath logs/installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The tail of each log as an annotation, readable without opening the run
      - name: Report failure
        if: failure()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          echo "::error title=steps::$(echo "$STEPS" | python -c "import json,sys; print(' '.join(f'{k}={v[\"outcome\"]}' for k,v in json.load(sys.stdin).items()))")"
          for f in logs/*.log; do
            [ -f "$f" ] || continue
            body=$(tail -n 40 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$(basename "$f")::${body}"
          done

      # Two artifacts, so each download holds only what it says. The portable
      # one is the app folder itself (GitHub zips it on download: no zip in a
      # zip); the installer is already compressed, so it is stored as is.
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: JD-Xi-Studio-${{ steps.version.outputs.label }}-win64-portable
          path: dist/JD-Xi-Studio/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JD-Xi-Studio-${{ steps.version.outputs.label }}-win64-setup
          path: dist/installer/*.exe
          compression-level: 0
          if-no-files-found: error

      # v1.2.3-beta.1 (any tag with a "-") is a pre-release, v1.2.3 a final release
      - name: Release
        # The workflow creates the release itself, as a draft, attaches the files and only then
        # publishes it: a published release cannot be changed when immutable releases are on
        # (that is why attaching files to a release made by hand failed). Do not create the
        # release by hand: push the tag and the release appears with its files.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > state.txt 2>/dev/null; then
            if [ "$(cat state.txt)" != "true" ]; then
              echo "::error::Release $TAG already exists and is published, so files cannot be added. Delete it on GitHub (keep the tag) and re-run this workflow; it will create the release with the files."
              exit 1
            fi
          else
            pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
            gh release create "$TAG" --draft $pre --generate-notes --title "$TAG" --verify-tag
          fi
          gh release upload "$TAG" "$PORTABLE" dist/installer/*.exe --clobber
          gh release edit "$TAG" --draft=false