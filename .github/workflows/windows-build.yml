name: Windows build

# Builds the Windows app (PyInstaller, one folder) and its installer (Inno Setup),
# opens it for a smoke test, and uploads both as artifacts. On a v* tag the
# files are also attached to a GitHub release (a pre-release for v*-beta.N tags).
on:
  push:
    branches: ["fix/**", "release/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path jdxi_editor/project.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $sha = "${{ github.sha }}".Substring(0, 7)
          "version=$v" >> $env:GITHUB_OUTPUT
          "label=$v-$sha" >> $env:GITHUB_OUTPUT
          # A release tag must match the app's version: v0.10.0-beta.1 <-> 0.10.0b1
          if ("${{ github.ref_type }}" -eq "tag") {
            $t = "${{ github.ref_name }}" -replace '^v', '' -replace '-alpha\.?', 'a' -replace '-beta\.?', 'b' -replace '-rc\.?', 'rc'
            if ($t -ne $v) {
              "::error::Tag ${{ github.ref_name }} does not match __version__ $v in jdxi_editor/project.py"
              exit 1
            }
          }

      # Not editable: the wheel build puts the scaled-down resources inside the
      # package (jdxi_editor/_bundle/resources), which the spec bundles
      - name: Install
        id: install
        shell: bash
        run: |
          set -o pipefail; mkdir -p logs
          { python -m pip install --upgrade pip &&
            python -m pip install ".[soundfont]" pyinstaller pytest; } 2>&1 | tee logs/install.log

      - name: Test
        id: test
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_preset_tables_match_manual.py tests/test_program_common_addresses.py tests/test_i18n.py tests/test_update_checker.py -q 2>&1 | tee logs/test.log

      - name: PyInstaller
        id: pyinstaller
        shell: bash
        run: |
          set -o pipefail
          # Run from outside the checkout so the spec imports the installed
          # package (with _bundle/resources), not the source tree
          cd "$RUNNER_TEMP"
          pyinstaller --noconfirm --clean \
            --distpath "$GITHUB_WORKSPACE/dist" --workpath "$RUNNER_TEMP/pyi-build" \
            "$GITHUB_WORKSPACE/building/windows/jdxi_editor.spec" 2>&1 | tee "$GITHUB_WORKSPACE/logs/pyinstaller.log"

      # The app must still be running after 30 s: an import error or a missing
      # resource makes a windowed PyInstaller app exit straight away
      - name: Smoke test
        id: smoke
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/jdxi_editor/jdxi_editor.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            "jdxi_editor.exe exited with code $($p.ExitCode)" | Out-File logs/smoke.log
            Get-ChildItem -Recurse $env:USERPROFILE -Filter *.log -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'jdxi' } |
              ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 60 } |
              Out-File -Append logs/smoke.log
            # Run the console Python entry point for the traceback
            & dist/jdxi_editor/jdxi_editor.exe 2>&1 | Select-Object -First 60 | Out-File -Append logs/smoke.log
            Get-Content logs/smoke.log
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "jdxi_editor.exe started and kept running"

      - name: Portable zip
        id: zip
        shell: pwsh
        run: |
          $name = "JDXI-Editor-${{ steps.version.outputs.label }}-win64-portable.zip"
          Compress-Archive -Path dist/jdxi_editor -DestinationPath "dist/$name"
          "PORTABLE=dist/$name" >> $env:GITHUB_ENV

      - name: Installer
        id: installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DMyAppVersion=${{ steps.version.outputs.version }} jdxi_editor.iss *>&1 | Tee-Object -FilePath logs/installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The tail of each log as an annotation, readable without opening the run
      - name: Report failure
        if: failure()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          echo "::error title=steps::$(echo "$STEPS" | python -c "import json,sys; print(' '.join(f'{k}={v[\"outcome\"]}' for k,v in json.load(sys.stdin).items()))")"
          for f in logs/*.log; do
            [ -f "$f" ] || continue
            body=$(tail -n 40 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$(basename "$f")::${body}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: JDXI-Editor-${{ steps.version.outputs.label }}-windows
          path: |
            ${{ env.PORTABLE }}
            dist/installer/*.exe
          if-no-files-found: error

      # v1.2.3-beta.1 (any tag with a "-") is a pre-release, v1.2.3 a final release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ env.PORTABLE }}
            dist/installer/*.exe
